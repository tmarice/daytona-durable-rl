[project]
name = "daytona-experiment-runner"
version = "0.1.0"
description = "Run experiments in Daytona sandboxes"
requires-python = ">=3.14,<3.15"
dependencies = [
    "daytona[v0-sdk]==2.0.0a8",
    "python-dotenv>=1.1,<2",
    "wandb>=0.31,<0.32",
    # W&B needs Pillow to upload the worker's PNG plots as images.
    "pillow>=11,<14",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100
# Preserve upstream formatting so the checkpoint adaptation is easy to diff.
extend-exclude = ["phy_rl/_vendor"]
