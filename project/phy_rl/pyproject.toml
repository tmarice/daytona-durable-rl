[project]
name = "phy-rl"
version = "0.1.0"
description = "Manual MuJoCo/MJX PPO training with local checkpoints and resume"
requires-python = ">=3.14,<3.15"
dependencies = [
    "playground==0.2.0",
    # The vendored PPO trainer includes the JAX device-placement compatibility fix.
    "brax==0.14.2",
    "jax[cuda12]==0.12.0.1; sys_platform == 'linux'",
    "matplotlib>=3.10,<4",
    "wandb>=0.31,<0.32",
    "python-dotenv>=1.1,<2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100
# Preserve upstream formatting so the checkpoint adaptation is easy to diff.
extend-exclude = ["_vendor"]
